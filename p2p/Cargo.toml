[package]
name = "p2p"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["gossip"]
gossip = ["dep:iroh-gossip"]
blobs = ["dep:iroh-blobs"]

[dependencies]
iroh = "1.1.0" #Upgrade to 1.2
iroh-gossip ={ version = "0.101.0",  optional = true}
iroh-blobs  = {version  = "0.103.0"
,optional = true
}
iroh-mainline-address-lookup = "0.4"
iroh-mdns-address-lookup = "0.4"
iroh-tickets = "=1"
n0-future = "0.3.2"

crux_core.workspace = true
facet = "=0.46.5"

anyhow = { workspace = true }
tokio.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
bytes   = "1.12.1"
futures-util = "0.3"
directories = "6.0.0" # For iroh::SecretKey persistance
tempfile = "3.27.0"
serde_json = "1.0.151"
data-encoding = "2.11.1"

[dev-dependencies]
loro   = "1.16.0"
